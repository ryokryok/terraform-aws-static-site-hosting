name: Terraform Plan

# PR の時点で差分をレビューできるようにする。読み取り専用ロールで実行し、
# 書き込みは main マージ後の deploy ワークフローに任せる
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.15.8

jobs:
  plan:
    # fork からの PR では実行しない。
    #
    # このジョブは PR のマージ ref、つまり未信頼のコードを checkout したうえで
    # terraform init / plan を回す。init はプロバイダを取得して実行するため、
    # 認証情報を持った状態で他人の PR の infra/** を動かすことになる。
    #
    # GitHub は fork の pull_request に OIDC トークンを発行しない（トークンが
    # read-only に制限され id-token: write が付かない）ため実際には Assume に
    # 失敗して止まるが、GitHub 側の挙動だけを頼りにはしない。
    # 併せて、fork PR ごとにジョブが失敗して赤くなるのも避ける
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate

      # -lock=false で state への書き込みを避ける（plan ロールは読み取りのみ）
      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -lock=false -no-color | tee plan.txt

      # 差分を PR 上で読めるようにする。コメントは 65536 文字が上限なので切り詰める
      - name: Comment plan result
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          {
            echo "## Terraform Plan (\`$OUTCOME\`)"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            if [ "$(wc -c < plan.txt)" -gt 60000 ]; then
              echo
              echo '> 出力が長いため切り詰めています。全文は Actions のログを参照してください。'
            fi
          } | gh pr comment "$PR_NUMBER" --body-file -
