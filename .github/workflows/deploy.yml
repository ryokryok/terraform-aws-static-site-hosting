name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC トークンの発行には id-token: write が必須
permissions:
  id-token: write
  contents: read

# apply 同士が競合しないよう直列化する。実行中のものはキャンセルしない
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.15.8

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
      distribution_id: ${{ steps.tf_output.outputs.distribution_id }}
      frontend: ${{ steps.targets.outputs.frontend }}
      infra: ${{ steps.targets.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            infra:
              - 'infra/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

      # 手動実行は差分を判定できないため常に対象とみなす。
      # ジョブ内からは job outputs を参照できないのでここで一度確定させる
      - name: Resolve targets
        id: targets
        working-directory: .
        run: |
          {
            echo 'infra=${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.infra == 'true' }}'
            echo 'frontend=${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.frontend == 'true' }}'
          } >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        if: steps.targets.outputs.infra == 'true'
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        if: steps.targets.outputs.infra == 'true'
        run: terraform validate

      - name: Terraform plan
        if: steps.targets.outputs.infra == 'true'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # 保存済みプランの適用は確認を求められないため -auto-approve は不要。
      # 差分がなければ no-op で終わる
      - name: Terraform apply
        if: steps.targets.outputs.infra == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # デプロイ先はハードコードせず state から取得する。
      # add-mask した値は job output に設定できない（GitHub が破棄する）ため
      # ここではマスクしない。バケット名にアカウントIDが含まれるが、
      # backend のバケット名も infra/main.tf に直書きしており秘匿情報ではない
      - name: Read outputs
        id: tf_output
        run: |
          {
            echo "s3_bucket=$(terraform output -raw s3_bucket)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
          } >> "$GITHUB_OUTPUT"

  # フロントエンドの静的チェック。terraform ジョブとは独立なので並列に走る
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 最初の失敗で止めず、3つの結果をまとめて出す
      - run: pnpm fmt:check
        if: "!cancelled()"
      - run: pnpm lint
        if: "!cancelled()"
      - run: pnpm typecheck
        if: "!cancelled()"

  deploy:
    needs: [terraform, check]
    # infra 変更でバケットが作り直された場合も再同期が要るため infra も条件に含める
    if: needs.terraform.outputs.frontend == 'true' || needs.terraform.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # OIDC で一時認証情報を取得する。アクセスキーは保存しない
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        env:
          S3_BUCKET: ${{ needs.terraform.outputs.s3_bucket }}
        run: aws s3 sync ./dist "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ needs.terraform.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'
