name: Deploy

on:
  push:
    branches: [main]

# OIDC トークンの発行には id-token: write が必須
permissions:
  id-token: write
  contents: read

# apply 同士が競合しないよう直列化する。実行中のものはキャンセルしない
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.15.8

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
      distribution_id: ${{ steps.tf_output.outputs.distribution_id }}
      frontend: ${{ steps.changes.outputs.frontend }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            infra:
              - 'infra/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        if: steps.changes.outputs.infra == 'true'
        run: terraform fmt -check -recursive

      # plan は読み取り専用ロールで実行する
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        if: steps.changes.outputs.infra == 'true'
        run: terraform validate

      # -lock=false で state への書き込みを避ける（plan ロールは読み取りのみ）
      - name: Terraform plan
        if: steps.changes.outputs.infra == 'true'
        run: terraform plan -input=false -lock=false -out=tfplan

      # apply ジョブへ受け渡す。プランには機微な値が含まりうるため保持期間を最短にする
      - name: Upload plan
        if: steps.changes.outputs.infra == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

      # デプロイ先はハードコードせず state から取得する。
      #
      # plan / apply が失敗してもデプロイ先自体は state から読めるため、
      # !cancelled() でここは止めない。フロントのデプロイを infra の失敗に
      # 巻き込ませないための措置。
      #
      # なお add-mask した値は job output に設定できない（GitHub が破棄する）
      # のでマスクはしない。バケット名にアカウントIDが含まれるが、backend の
      # バケット名も infra/main.tf に直書きしており秘匿情報として扱っていない
      - name: Read outputs
        id: tf_output
        if: "!cancelled()"
        run: |
          {
            echo "s3_bucket=$(terraform output -raw s3_bucket)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
          } >> "$GITHUB_OUTPUT"

  # 書き込みを伴う唯一のジョブ。environment: production を宣言することで
  # apply ロールの信頼ポリシー（sub = environment:production）を満たす。
  # Environment 側でブランチを main に限定しているため、他ブランチから
  # このジョブを宣言してもトークンが発行されない。
  #
  # さらに required reviewers を設定してあり、承認するまでこのジョブは
  # 停止する。承認前は OIDC トークンが発行されない、つまり AWS への書き込み
  # 権限そのものが存在しない状態になる。確認ダイアログではなく権限の境界。
  #
  # なお deploy ジョブはこのジョブに依存していないため、承認待ちで
  # フロントエンドのリリースが止まることはない
  terraform-apply:
    needs: terraform
    if: needs.terraform.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      # 保存済みプランの適用は確認を求められないため -auto-approve は不要。
      # plan で確定した内容だけが適用される
      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

  deploy:
    needs: [terraform]
    # terraform ジョブの失敗ではフロントのデプロイを止めない。
    # デプロイ先が取得できていれば（= state に到達できていれば）実行する。
    # infra 変更でバケットが作り直された場合も再同期が要るため infra も条件に含める
    #
    # fmt / lint / typecheck / test は ci.yaml に移した。同じ push で並列に
    # 走るが、デプロイの前提条件にはしていない。型やフォーマットの不備で
    # 配信を止めるより、ビルドが通る限り出したいという判断。
    # ビルド自体が壊れていれば下の pnpm build で止まる
    if: >-
      !cancelled()
      && needs.terraform.outputs.s3_bucket != ''
      && (needs.terraform.outputs.frontend == 'true' || needs.terraform.outputs.infra == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # OIDC で一時認証情報を取得する。アクセスキーは保存しない
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # aws s3 sync は Cache-Control を付けないため2段に分ける。
      # assets/ は Vite がハッシュ付きの名前を出すので不変として長期キャッシュでき、
      # index.html は毎回再検証させる必要がある。
      # アセットを先に上げることで、新しい index.html が参照先を欠く時間をなくす
      - name: Sync assets to S3
        env:
          S3_BUCKET: ${{ needs.terraform.outputs.s3_bucket }}
        run: |
          aws s3 sync ./dist "s3://$S3_BUCKET" --delete \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public, max-age=31536000, immutable'

      - name: Sync entrypoints to S3
        env:
          S3_BUCKET: ${{ needs.terraform.outputs.s3_bucket }}
        run: |
          aws s3 sync ./dist "s3://$S3_BUCKET" --delete \
            --exclude 'assets/*' \
            --cache-control 'public, max-age=0, must-revalidate'

      # assets/ はハッシュ付きで immutable 指定のため、内容が変われば URL も変わる。
      # 無効化が要るのは URL が変わらないエントリポイントだけ
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ needs.terraform.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/' '/index.html'
