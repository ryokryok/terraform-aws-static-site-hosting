name: CI

# 全ブランチの push で発火する。マージ後にしか静的チェックが走らない状態を
# 解消するのが目的なので、paths での絞り込みはしない。
#
# 同一リポジトリのブランチであれば PR を開く前から走るため、pull_request は
# 購読しない（購読すると同じコミットで二重に走る）
on: push

# 読み取りのみ。このワークフローは AWS の認証情報を一切必要としない
permissions:
  contents: read

# 同じブランチへ連続で push したら古いものは捨てる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.15.8

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 最初の失敗で止めず、4つの結果をまとめて出す。
      # oxfmt は Markdown も整形対象にしている点に注意
      - run: pnpm fmt:check
        if: "!cancelled()"
      - run: pnpm lint
        if: "!cancelled()"
      - run: pnpm typecheck
        if: "!cancelled()"
      - run: pnpm test
        if: "!cancelled()"

  # frontend とは独立なので並列に走る
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false で S3 backend への接続を省く。
      #
      # validate は構文と型の検査であって state を見ないため、これで足りる。
      # 認証情報が要らないので OIDC を使わずに済み、このジョブはどこから
      # 実行されても AWS に触れない。plan が必要なレビューは
      # terraform-plan.yml（読み取り専用ロール）の担当
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
